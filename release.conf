# Values ship reads. The loop is in ~/notes/releasing.md.
# Format and keys: anderix/ship, docs/PROFILE.md.
#
# lux ships no Debian package and reaches no apt repository: anderix has none,
# and will not until there are enough command-line tools to justify one.
# The crate is `luxc`; the binary, the library and everything a person types
# are `lux`.
loop=cargo-dist
version_file=Cargo.toml
apt_package=
deb_packages=0
deb_arches=
crates=luxc
homebrew=yes
winget=Anderix.luxc:luxc-x86_64-pc-windows-msvc.zip
store_lanes=
commands=lux
