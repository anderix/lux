# Values ship reads. Format and keys: anderix/ship, docs/DESIGN.md.
#
# lux ships no Debian package and reaches no apt repository: anderix has none,
# and will not until there are enough command-line tools to justify one.
# The crate is `luxc`; the binary, the library and everything a person types
# are `lux`.
# winget Anderix.luxc parked: Defender flags every build and the package waits on that
targets=crates homebrew
commands=lux
crates=luxc
