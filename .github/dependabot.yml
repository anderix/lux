# Dependabot keeps the GitHub Actions used by CI, the crate publish, and the
# release current, so security fixes show up as PRs rather than slipping past.
#
# Deliberately no `cargo` block. Cargo.toml declares zero dependencies — that is
# a standing property of this compiler rather than an accident — and an
# ecosystem with no manifest to scan produces a red weekly run with an opaque
# updater error, hit on paxc and again on xinglet.com. Add one if a real
# dependency ever lands, not before.
#
# Also deliberately no CodeQL to bump alongside these. That skip is on
# attack-surface grounds and not language-maturity grounds: CodeQL's Rust
# support went GA in 2025, and a local compiler reading developer-supplied
# source has no taint flow from adversarial input to a dangerous sink. Do not
# let a template copy re-add it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
    # release.yml is generated by cargo-dist, and its `plan` job re-derives the
    # workflow and fails if the file on disk differs. So a Dependabot bump of any
    # action dist pins makes the workflow drift from its generator, and `plan`
    # goes red on every PR and blocks the next release until it is reverted (#88
    # here, ved 2026-05-14 before it). Those pins move when cargo-dist itself is
    # bumped in dist-workspace.toml and `dist generate` is re-run. That is the
    # update channel for them; Dependabot is not.
    #
    # The cost is real and worth naming: ci.yml and publish-crate.yml check out
    # with actions/checkout too, and Dependabot cannot scope an ignore to one
    # file, so their checkout stops being bumped as well. A stale checkout in two
    # hand-written workflows is the smaller problem — it is a runner utility with
    # no access to anything the workflow does not already hold — set against a
    # release pipeline that fails validation every week.
    ignore:
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "actions/download-artifact"
      # swift-actions/setup-swift v3 fetches Swiftly and verifies its signature,
      # and that verification dies on the runner with "Can't check signature: No
      # public key", taking the conformance job's Swift leg down with it (#88).
      # Only the major is held back, so v2.x fixes still arrive. Drop this entry
      # once v3 installs cleanly upstream.
      - dependency-name: "swift-actions/setup-swift"
        update-types: ["version-update:semver-major"]
