name: ci

# Two halves, and only one of them is lux's.
#
# The fast gate — formatting, lints, and the Rust test suite — is the same
# check every Rust repo in the fleet runs, so it calls the shared policy in
# anderix/.github instead of keeping a copy. luxc publishes to crates.io with a
# [lib] target, so it calls the library policy: docs are rendered on docs.rs
# and the crate is the release.
#
# The conformance sweep is lux's alone and stays here. It is the whole claim of
# the language — the same program behaves the same on all three targets — and
# no other repo has anything like it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One in-flight run per branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, clippy, the Rust tests, the rendered docs, and the packaged
  # crate. The transpiler tests that need a target compiler skip themselves
  # when it is absent (see tool_available), so this job proves the interpreter
  # and every compiler-free test on its own, quickly.
  core:
    uses: anderix/.github/.github/workflows/rust-lib-ci.yml@main

  # The whole point of lux: the same program behaves the same on all three
  # targets. This job installs Go, Rust, and Swift and runs the full sweep —
  # cargo test again (now with every backend present) plus the conformance and
  # flex corpora against the freshly-built binary.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: swift-actions/setup-swift@v3
      - run: ./check.sh
