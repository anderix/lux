name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One in-flight run per branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: formatting, lints, and the Rust test suite. The transpiler tests
  # that need a target compiler skip themselves when it's absent (see
  # tool_available), so this job proves the interpreter and every compiler-free
  # test on its own, quickly.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The whole point of lux: the same program behaves the same on all three
  # targets. This job installs Go, Rust, and Swift and runs the full sweep —
  # cargo test again (now with every backend present) plus the conformance and
  # flex corpora against the freshly-built binary.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: swift-actions/setup-swift@v2
      - run: ./check.sh
